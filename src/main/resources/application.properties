spring.application.name=PhillyViolence

# Local MySQL connection details
spring.datasource.url=jdbc:mysql://localhost:3306/phillyviolence
spring.datasource.username=root
spring.datasource.password=password

spring.security.user.name=admin
spring.security.user.password=admin

spring.jpa.show-sql=false
spring.jpa.generate-ddl=true
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# Database connection retry settings
spring.datasource.hikari.connection-timeout=60000
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1200000
spring.datasource.hikari.connection-test-query=SELECT 1
spring.datasource.hikari.validation-timeout=3000

# JPA and Hibernate configuration
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Disable schema generation to avoid transaction issues
spring.jpa.hibernate.ddl-auto=none
spring.jpa.generate-ddl=false

# Disable transaction management temporarily
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.connection.provider_disables_autocommit=false

# Startup delay to allow database to be ready
spring.jpa.defer-datasource-initialization=true
