spring.application.name=PhillyViolence

# Railway MySQL connection details
spring.datasource.url=jdbc:mysql://crossover.proxy.rlwy.net:27720/railway
spring.datasource.username=root
spring.datasource.password=IMZmoUrvkcvNIjZRGWryamqtEyrovDKs

spring.security.user.name=admin
spring.security.user.password=admin

spring.jpa.show-sql=false
spring.jpa.generate-ddl=true
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# Database connection retry settings
spring.datasource.hikari.connection-timeout=60000
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1200000
spring.datasource.hikari.connection-test-query=SELECT 1
spring.datasource.hikari.validation-timeout=3000

# JPA connection retry
spring.jpa.properties.hibernate.connection.provider_disables_autocommit=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Disable autocommit for Hibernate transactions
spring.jpa.properties.hibernate.connection.autocommit=false

# Startup delay to allow database to be ready
spring.jpa.defer-datasource-initialization=true
